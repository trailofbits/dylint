[workspace]
members = ["*", "non_topologically_sorted_functions/attr"]
exclude = [".cargo"]
resolver = "2"

[workspace.dependencies]
anyhow = "1.0"
camino = "1.2"
cargo_metadata = "0.23"
clippy_utils = { git = "https://github.com/rust-lang/rust-clippy", rev = "2dd71153b54873bce06a89b65653f346fb528d13" }
daggy = "0.9"
diesel = "2.3"
git2 = "0.21"
heck = "0.5"
serde = "1.0"
tempfile = "3.27"
thiserror = "2.0"
toml = "1.2"

[workspace.lints.clippy]
nursery = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
missing_panics_doc = "allow"
option_if_let_else = "allow"

[workspace.lints.rust.unexpected_cfgs]
level = "deny"
check-cfg = ["cfg(dylint_lib, values(any()))"]

[workspace.metadata.dylint]
libraries = [
    { path = "../general" },
    { path = "../supplementary" },
    { path = "../testing/clippy" },
    { path = "../restriction/*" },
]

[workspace.metadata.rust-analyzer]
rustc_private = true
