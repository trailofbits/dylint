[package]
name = "nightly"
description = "Containing package for Dylint workspaces requiring a nightly toolchain"
version = "6.0.4"
edition = "2024"
publish = false

[build-dependencies]
nested_workspace = { workspace = true }

dylint_internal = { version = "=6.0.4", path = "../internal" }

[dev-dependencies]
nested_workspace = { workspace = true }

[lints]
workspace = true

[package.metadata.nested_workspace]
roots = [
    "../driver",
    # smoelius: Do not build/test "../internal/template". It is covered by the `new_package` test in
    # cargo-dylint/tests/integration/package_options.rs.
    # "../internal/template",
    "../utils/linting",
]
