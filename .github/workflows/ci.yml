name: CI

on:
  merge_group:
  pull_request:
  schedule:
    - cron: "0 3 * * tue"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  check-up-to-dateness:
    outputs:
      is-up-to-date: ${{ steps.main.outputs.is-up-to-date }}

    runs-on: ubuntu-latest

    steps:
      - id: main
        uses: trailofbits/check-up-to-dateness@v2

  # Deciding which packages to test before the matrix is expanded avoids starting jobs
  # for the expensive tests only for them to exit immediately.
  packages:
    needs: [check-up-to-dateness]

    if: needs.check-up-to-dateness.outputs.is-up-to-date != 'true'

    runs-on: ubuntu-latest

    outputs:
      packages: ${{ steps.packages.outputs.packages }}

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - id: packages
        run: |
          PACKAGES='["cargo-dylint", "dylint_examples", "other"]'
          if [[ '${{ github.event_name }}' = 'schedule' || '${{ github.event_name }}' = 'workflow_dispatch' ]] ||
            git diff --name-only ${{ github.event.pull_request.base.sha }} | grep -w 'expensive'
          then
            PACKAGES='["cargo-dylint", "dylint_examples", "expensive-auto_correct", "expensive-alpine", "expensive-boundary_toolchains", "expensive-custom_toolchain", "other"]'
          fi
          echo "packages=$PACKAGES" >> "$GITHUB_OUTPUT"

  test:
    # Name jobs by environment and package only, rather than by every value in the matrix entry.
    name: test (${{ matrix.environment }}, ${{ matrix.package }})

    needs: [check-up-to-dateness, packages]

    if: needs.check-up-to-dateness.outputs.is-up-to-date != 'true'

    strategy:
      fail-fast: ${{ github.event_name == 'merge_group' }}
      matrix:
        environment: [ubuntu-latest, macos-latest, windows-latest]
        package: ${{ fromJSON(needs.packages.outputs.packages) }}
        # Per-suite setup. Every job installs `cargo-nested`; the other tools are installed only
        # for the suites whose tests use them.
        include:
          - tools:
              - cargo-nested
          - package: dylint_examples
            rustfmt: true
          - environment: ubuntu-latest
            package: cargo-dylint-ci
            tools:
              - cargo-hack
              - cargo-license
              - cargo-msrv
              - cargo-nested
              - cargo-rdme
              - cargo-supply-chain
              - cargo-udeps
              - cargo-unmaintained
              - rustdoc-prettier
            prettier: true
            rustfmt: true
            rdme-toolchain: true

    runs-on: ${{ matrix.environment }}

    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # smoelius: The `nightly_toolchain` test makes sense only if the nightly driver is cached.
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            ~/.cargo/git/checkouts/
            ~/.dylint_drivers/
            target/dylint/libraries/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Rustup
        run: rustup update

      - name: Install dylint-link
        run: cargo install --path ./dylint-link --features=__copy_library_disabled_by_default --force

      - uses: taiki-e/install-action@v2.90.6
        with:
          tool: ${{ join(matrix.tools, ', ') }}

      - name: Free up space on Ubuntu
        if: ${{ matrix.environment == 'ubuntu-latest' }}
        run: |
          # https://github.com/actions/runner-images/issues/2606#issuecomment-772683150
          # du -sh /usr/*/* 2>/dev/null | sort -h
          sudo rm -rfv /usr/lib/google-cloud-sdk | grep . >/dev/null
          sudo rm -rfv /usr/lib/jvm              | grep . >/dev/null
          sudo rm -rfv /usr/share/az_*           | grep . >/dev/null
          sudo rm -rfv /usr/share/dotnet         | grep . >/dev/null
          sudo rm -rfv /usr/share/swift          | grep . >/dev/null

      - name: Free up space on macOS
        if: ${{ matrix.environment == 'macos-latest' }}
        run: |
          # https://github.com/actions/runner-images/issues/2840#issuecomment-2334584217
          # du -sh /*/* 2>/dev/null | sort -h
          sudo rm -rfv /Applications/Xcode* | grep . >/dev/null

      - name: Free up space on Windows
        if: ${{ matrix.environment == 'windows-latest' }}
        run: |
          # du -sh /c/*/* 2>/dev/null | sort -h
          rm -rfv /c/Program\ Files\ \(x86\)/Android | grep . >/dev/null
          rm -rfv /c/ghcup/ghc                       | grep . >/dev/null
          rm -rfv /c/rtools*                         | grep . >/dev/null

      - name: Install Prettier
        if: ${{ matrix.prettier }}
        run: npm install -g prettier

      - name: Install nightly rustfmt
        if: ${{ matrix.rustfmt }}
        run: rustup component add rustfmt --toolchain nightly

      # smoelius: The next step avoids tests having to use `rustup` concurrently.
      - name: Preinstall toolchains
        run: cargo run -p dylint_internal --bin preinstall-toolchains

      # smoelius: Toolchain nightly-2026-08-05 is needed for cargo-rdme 2.2.0.
      - name: Install cargo-rdme toolchain
        if: ${{ matrix.rdme-toolchain }}
        run: |
          rustup toolchain add nightly-2026-08-05
          rustup component add llvm-tools-preview rustc-dev --toolchain nightly-2026-08-05

      - name: Fetch dependencies
        run: cargo nested fetch

      - name: Test
        run: |
          if [[ '${{ matrix.package }}' =~ ^cargo-dylint ]]; then
            case '${{ matrix.package }}' in
              cargo-dylint)
                cargo test -p cargo-dylint --no-default-features --features=cargo-cli
                ;;
              cargo-dylint-ci)
                cargo test -p cargo-dylint --test ci
                if [[ '${{ github.event_name }}' = 'schedule' || '${{ github.event_name }}' = 'workflow_dispatch' ]] ||
                  git diff --name-only ${{ github.event.pull_request.base.sha }} | grep -w 'scheduled'
                then
                  cargo test -p scheduled
                fi
                ;;
              *)
                exit 1
                ;;
            esac
          elif [[ '${{ matrix.package }}' != 'other' ]]; then
            PACKAGE=''
            TEST=''
            if [[ '${{ matrix.package }}' =~ ^expensive- ]]; then
              PACKAGE='expensive'
              TEST='${{ matrix.package }}'
              TEST="--test=${TEST#'expensive-'}"
            else
              PACKAGE='${{ matrix.package }}'
            fi
            cargo test -p "$PACKAGE" "$TEST"
          else
            cargo test --all-features --workspace --exclude cargo-dylint --exclude dylint --exclude dylint_examples --exclude expensive --exclude scheduled
            cargo test -p dylint --features=library_packages,package_options
            cargo +nightly test -p dylint_internal --test build

            # smoelius: The `cdylib` -> `lib` trick is due to @MinerSebas.
            for X in examples/*/*; do
              if [[ ! -d "$X" ]]; then
                continue
              fi
              if [[ "$(basename "$X")" = '.cargo' || "$(basename "$X")" = 'src' ]]; then
                  continue
              fi
              pushd "$X"
              sed -i.bak 's/"cdylib"/"lib"/g' Cargo.toml
              # smoelius: `RUSTUP_WINDOWS_PATH_ADD_BIN=1` is needed for the `redundant_reference`
              # doc tests to pass on Windows.
              RUSTUP_WINDOWS_PATH_ADD_BIN=1 cargo test --doc
              popd
            done
          fi
        env:
          CARGO_INCREMENTAL: 0
          GITHUB_TOKEN: ${{ github.token }}

  all-checks:
    needs: [packages, test]

    # smoelius: From "Defining prerequisite jobs"
    # (https://docs.github.com/en/actions/using-jobs/using-jobs-in-a-workflow#defining-prerequisite-jobs):
    # > If you would like a job to run even if a job it is dependent on did not succeed, use the
    # > `always()` conditional expression in `jobs.<job_id>.if`.
    if: ${{ always() }}

    runs-on: ubuntu-latest

    steps:
      - name: Check results
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: exit 1
