[package]
name = "dylint_driver"
version = "6.2.0"
authors = ["Samuel E. Moelius III <sam@moeli.us>"]
description = "Dylint driver library"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/trailofbits/dylint"

build = "build/main.rs"

[dependencies]
anyhow = "1.0"
libc = "0.2"
libloading = "0.9"
log = "0.4"
rustversion = "1.0"
serde_json = "1.0"

dylint_internal = { version = "=6.2.0", path = "../internal", features = [
    "rustup",
] }

[build-dependencies]
anyhow = "1.0"
git2 = "0.21"
proc-macro2 = "1.0"
rustversion = "1.0"
syn = { version = "3.0", features = ["full"] }

dylint_internal = { version = "=6.2.0", path = "../internal", features = [
    "clippy_utils",
    "rustup",
] }

[[test]]
name = "extra_symbols"
path = "build/extra_symbols.rs"

[dev-dependencies]
anyhow = "1.0"
git2 = "0.21"
proc-macro2 = "1.0"
rustc_version = "0.4"
syn = { version = "3.0", features = ["full"] }
tempfile = "3.27"

dylint_internal = { version = "=6.1.1", path = "../internal", features = [
    "clippy_utils",
    "rustup",
] }

[lints.clippy]
nursery = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
option_if_let_else = "allow"
redundant_pub_crate = "allow"

[lints.rust.unexpected_cfgs]
level = "deny"
check-cfg = ["cfg(dylint_lib, values(any()))"]

[workspace]

[workspace.metadata.dylint]
libraries = [
    { path = "../examples/general" },
    { path = "../examples/supplementary" },
    { path = "../examples/testing/clippy" },
    { path = "../examples/restriction/*" },
]
